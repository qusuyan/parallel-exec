[package]
edition = "2024"
name = "replay"
version = "0.1.0"

[dependencies]
chrono = "0"
clap = {version = "4", default-features = false, features = ["help", "suggestions", "color", "std", "cargo", "derive"]}
env_logger = "0"
log = "0"
parallel-exec = {path = "../"}
primitive-types = "0.14.0"
serde = {version = "1", features = ["derive"]}
serde_json = "1"
tokio = {version = "1", features = ["full"]}
uint = "0"