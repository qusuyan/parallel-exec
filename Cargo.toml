[workspace]
members = ["replay"]

[package]
edition = "2024"
name = "parallel-exec"
version = "0.1.0"

[lib]

[dependencies]
async-trait = "0.1.89"
clap = {version = "4", default-features = false, features = ["help", "suggestions", "color", "std", "cargo", "derive"]}
dashmap = "6.1.0"
log = "0"
lru = "0.12"
primitive-types = "0.14.0"
tokio = {version = "1", features = ["time", "macros", "rt", "sync"]}

[dev-dependencies]
rand = "0.9"
tokio = {version = "1", features = ["time", "macros", "rt", "rt-multi-thread", "sync"]}
rand_distr = "0.5"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "zipf"
harness = false